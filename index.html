<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Network Manager by Mattias</title>
<style>
:root {
  --bg-color:#f0f0f0; --fg-color:#333333; --entry-bg:#ffffff;
  --button-bg:#cccccc; --select-bg:#a0a0a0; --accent-color:#3498db;
  --headline-color:#1a237e; --summary-color:#555555; --category-color:#4a148c;
  --separator-color:#e0e0e0; --highlight-bg:#ffa726; --container-bg:#ffffff;
  --border-color:#cccccc; --shadow-color:rgba(0,0,0,0.1); --badge-bg:#e8e8e8;
  --badge-fg:#555555; --download-color:#8b949e; --overlay-color:rgba(0,0,0,0.5);
  --error-color:#e74c3c; --warning-color:#f39c12; --info-color:#3498db; --success-color:#27ae60;
}
body.dark-mode {
  --bg-color:#1e1e1e; --fg-color:#ffffff; --entry-bg:#3c3c3c;
  --button-bg:#505050; --select-bg:#5a5a5a; --accent-color:#2ecc71;
  --headline-color:#82b1ff; --summary-color:#b0bec5; --category-color:#ce93d8;
  --separator-color:#3e3e42; --highlight-bg:#ffa726; --container-bg:#2d2d30;
  --border-color:#444444; --shadow-color:rgba(0,0,0,0.3); --badge-bg:#3e3e42;
  --badge-fg:#b0bec5; --download-color:#8b949e; --overlay-color:rgba(0,0,0,0.7);
  --error-color:#c0392b; --warning-color:#f1c40f; --info-color:#2ecc71; --success-color:#2ecc71;
}
*,*::before,*::after { box-sizing:border-box; }
html { scrollbar-gutter:stable; }
html,body { width:100%; min-height:100vh; min-height:100dvh; margin:0; padding:0; overflow-x:hidden; }
body { font-family:Arial,sans-serif; background:var(--bg-color); color:var(--fg-color); transition:background-color .3s,color .3s; padding:0 12px 30px; }
.container { position:relative; width:100%; max-width:800px; background:var(--container-bg); padding:20px; margin:20px auto; border-radius:8px; box-shadow:0 2px 10px var(--shadow-color); }
h1 { color:var(--accent-color); text-align:center; margin-top:0; }
.subtitle { text-align:center; font-size:1.1em; font-weight:normal; margin:0 0 20px; border-bottom:2px solid var(--border-color); padding-bottom:12px; }
.controls { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
.controls .grow { flex:1 1 180px; }
.btn { padding:8px 15px; border:1px solid var(--border-color); border-radius:4px; cursor:pointer; font-weight:bold; font-family:inherit; font-size:.9em; background:var(--button-bg); color:var(--fg-color); text-decoration:none; display:inline-block; transition:background-color .2s; }
.btn:hover { background:var(--select-bg); }
.btn.sm { padding:5px 10px; font-size:.82em; }
.btn.accent { background:var(--accent-color); border-color:var(--accent-color); color:#fff; }
.btn.accent:hover { background:color-mix(in srgb,var(--accent-color) 80%,black); }
.btn.danger { background:var(--error-color); border-color:var(--error-color); color:#fff; }
.btn.danger:hover { background:color-mix(in srgb,var(--error-color) 80%,black); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible { outline:2px solid var(--accent-color); outline-offset:2px; }
input,select,textarea { width:100%; padding:8px 10px; background:var(--entry-bg); color:var(--fg-color); border:1px solid var(--border-color); border-radius:4px; font-family:inherit; font-size:.95em; }
textarea { resize:vertical; min-height:70px; }
.controls select { width:auto; }
label { display:block; font-size:.85em; color:var(--summary-color); margin:0 0 4px; }
.count { color:var(--summary-color); font-size:.85em; margin:0 0 10px; }
mark,mark.search-highlight { background:var(--highlight-bg); color:#000; border-radius:2px; padding:0 1px; }

/* Host cards */
.host { background:var(--entry-bg); border:1px solid var(--border-color); border-left:4px solid var(--border-color); border-radius:6px; padding:12px 14px; cursor:grab; -webkit-touch-callout:none; position:relative; }
.host.ok { border-left-color:var(--accent-color); } .host.warn { border-left-color:var(--warning-color); } .host.err { border-left-color:var(--error-color); }
.host-head { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.host-name { font-size:1.1em; font-weight:bold; color:var(--headline-color); margin-right:auto; word-break:break-word; }
.badge { font-size:.75em; padding:2px 9px; border-radius:10px; background:var(--badge-bg); color:var(--badge-fg); font-weight:bold; }
.badge.role { background:var(--category-color); color:#fff; }
.ip { font-family:Consolas,Monaco,monospace; font-size:.9em; background:none; border:none; padding:0; color:var(--accent-color); cursor:pointer; font-weight:bold; }
.ip:hover { text-decoration:underline; }
.meta { color:var(--summary-color); font-size:.85em; margin-top:6px; }
.meta .err { color:var(--error-color); font-weight:bold; } .meta .warn { color:var(--warning-color); font-weight:bold; } .meta .ok { color:var(--success-color); }
.actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; padding-top:10px; border-top:1px solid var(--separator-color); }
.notes { margin-top:8px; font-size:.88em; color:var(--summary-color); white-space:pre-wrap; word-break:break-word; }
.empty { text-align:center; padding:35px 10px; color:var(--summary-color); border:1px dashed var(--border-color); border-radius:6px; }

/* Drag, chips */
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr)); gap:12px; }
.host.dragging { opacity:.8; outline:2px dashed var(--accent-color); outline-offset:4px; box-shadow:0 6px 18px var(--shadow-color); transform:scale(1.02); z-index:10; }
body.is-dragging,body.is-dragging * { cursor:grabbing !important; user-select:none; -webkit-user-select:none; }
.emoji { margin-right:6px; }
.addr { display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:6px; }
.ip.dns { color:var(--summary-color); }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.chip { padding:3px 9px; border:1px solid var(--border-color); border-radius:12px; background:var(--button-bg); color:var(--fg-color); font-size:.8em; cursor:pointer; font-family:inherit; }
.chip:hover { background:var(--select-bg); }
.chip.e { font-size:1.1em; padding:2px 7px; }
input[type=checkbox] { width:auto; }
.split { display:inline-flex; }
.split .btn { border-radius:0; }
.split .btn:first-child { border-radius:4px 0 0 4px; }
.split .btn:last-child { border-radius:0 4px 4px 0; }
.split .btn:only-child { border-radius:4px; }
.split .btn + .btn { margin-left:-1px; }
.links { display:block; margin-top:12px; border-top:1px solid var(--separator-color); }
.ep { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px 10px; padding:8px 0; border-bottom:1px solid var(--separator-color); }
.ep:last-child { border-bottom:none; }
.et { display:flex; flex-direction:column; min-width:0; flex:1 1 110px; }
.en { color:var(--headline-color); font-weight:bold; word-break:break-word; }
.esub { color:var(--summary-color); font-size:.78em; font-family:Consolas,Monaco,monospace; word-break:break-all; }
.tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
.chip.tag { font-size:.75em; padding:1px 8px; }
.chip.on { background:var(--accent-color); border-color:var(--accent-color); color:#fff; }
.addr.off { opacity:.55; }
.r { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.r input,.r select { width:auto; }
.arow,.erow { margin-bottom:8px; }
.emo { max-height:92px; overflow-y:auto; border:1px solid var(--separator-color); border-radius:4px; padding:4px; }
.mono { font-family:Consolas,Monaco,monospace; font-size:.85em; }
.logrow { display:flex; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px solid var(--separator-color); font-size:.88em; }
details.rb { margin-top:8px; font-size:.88em; }
details.rb summary { cursor:pointer; color:var(--accent-color); font-weight:bold; }
details.rb .notes { margin-top:6px; font-size:.9em; font-family:Consolas,Monaco,monospace; }
.sub { font-size:.85em; font-weight:bold; color:var(--category-color); margin:10px 0 6px; }
.drow { padding:8px 0; border-bottom:1px solid var(--separator-color); }
.drow textarea { margin-top:6px; }
.dh { background:none; border:none; color:var(--summary-color); cursor:grab; font-size:1.3em; line-height:1; padding:2px 6px; touch-action:none; user-select:none; -webkit-user-select:none; }
.dh:hover { color:var(--accent-color); }
.drow.dragging { opacity:.85; outline:2px dashed var(--accent-color); outline-offset:2px; background:var(--container-bg); }
.ibox { background:var(--entry-bg); border-left:3px solid var(--accent-color); border-radius:4px; padding:10px 14px; margin-bottom:12px; font-size:.9em; line-height:1.5; }
.ibox h4 { margin:0 0 6px; color:var(--accent-color); font-size:1em; }
.ibox ul { padding-left:20px; margin:0; }
.ibox li { margin-bottom:8px; }
.ibox .it { color:var(--accent-color); font-weight:bold; display:block; }
details.fs { margin-top:12px; border-top:1px solid var(--separator-color); }
details.fs > summary { cursor:pointer; color:var(--category-color); font-weight:bold; padding:8px 0; list-style:none; user-select:none; }
details.fs > summary::-webkit-details-marker { display:none; }
details.fs > summary::before { content:'▸ '; }
details.fs[open] > summary::before { content:'▾ '; }
.fsb { padding:4px 0 6px; }
.srow { padding:8px 0; border-bottom:1px solid var(--separator-color); }
.modal.wide { max-width:920px; }
.mapsvg { display:block; margin:6px auto 0; width:100%; height:auto; max-height:65vh; }
.mnode { fill:var(--entry-bg); stroke:var(--border-color); stroke-width:1; }
.macc { fill:var(--accent-color); }
.mname { font:bold 13px Arial,sans-serif; fill:var(--headline-color); }
.maddr { font:11px Consolas,Monaco,monospace; fill:var(--summary-color); }
.medge { stroke:var(--summary-color); stroke-width:1.5; fill:none; }
.marrow { fill:var(--summary-color); }
.mlabel { font:bold 11px Arial,sans-serif; fill:var(--fg-color); stroke:var(--container-bg); stroke-width:4px; paint-order:stroke; }
.nrow { padding:8px 0; border-bottom:1px solid var(--separator-color); }
.subnet { margin-top:8px; }
.oct { display:flex; flex-wrap:wrap; align-items:center; gap:4px; font-family:Consolas,Monaco,monospace; }
.oct b { color:var(--summary-color); }
.n-o { width:58px; text-align:center; font-family:inherit; opacity:.6; }
.n-o.fix { opacity:1; border-color:var(--accent-color); font-weight:bold; }
.n-o.part { opacity:1; border-style:dashed; border-color:var(--accent-color); }
/* Amount picker (slider + stepper), see design guidelines section 6 */
.amount-picker { display:flex; align-items:center; gap:16px; width:100%; max-width:360px; margin-top:8px; }
.amount-picker input.amount-slider { --fill:0%; -webkit-appearance:none; appearance:none; flex:1; width:auto; min-width:0; height:28px; margin:0; padding:0; border:none; border-radius:0; background:transparent; cursor:pointer; outline:none; }
.amount-slider::-webkit-slider-runnable-track { height:6px; border-radius:3px; border:1px solid var(--border-color); background:linear-gradient(to right,var(--accent-color) var(--fill),var(--entry-bg) var(--fill)); }
.amount-slider::-moz-range-track { height:6px; border-radius:3px; border:1px solid var(--border-color); background:linear-gradient(to right,var(--accent-color) var(--fill),var(--entry-bg) var(--fill)); }
.amount-slider::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; margin-top:-7px; border:none; border-radius:50%; background:var(--accent-color); box-shadow:0 1px 4px var(--shadow-color); transition:transform .15s; }
.amount-slider::-moz-range-thumb { width:18px; height:18px; border:none; border-radius:50%; background:var(--accent-color); box-shadow:0 1px 4px var(--shadow-color); transition:transform .15s; }
.amount-slider:hover::-webkit-slider-thumb,.amount-slider:active::-webkit-slider-thumb { transform:scale(1.15); }
.amount-slider:hover::-moz-range-thumb,.amount-slider:active::-moz-range-thumb { transform:scale(1.15); }
.amount-slider:focus-visible::-webkit-slider-thumb { box-shadow:0 0 0 4px color-mix(in srgb,var(--accent-color) 35%,transparent); }
.amount-slider:focus-visible::-moz-range-thumb { box-shadow:0 0 0 4px color-mix(in srgb,var(--accent-color) 35%,transparent); }
.amount-stepper { display:flex; align-items:center; gap:6px; flex-shrink:0; }
.amount-picker .step-btn { width:36px; height:36px; padding:0; border:1px solid var(--border-color); border-radius:6px; background:var(--button-bg); color:var(--fg-color); font-family:inherit; font-size:1.2em; font-weight:bold; line-height:1; cursor:pointer; user-select:none; touch-action:manipulation; transition:background-color .2s; }
.amount-picker .step-btn:hover { background:var(--select-bg); }
.amount-picker .step-btn:active { transform:scale(.95); }
.amount-picker input.amount-input[type="number"] { width:56px; height:36px; padding:0; border:1px solid var(--border-color); border-radius:6px; background:var(--entry-bg); color:var(--fg-color); font-family:inherit; font-size:1.05em; font-weight:bold; text-align:center; -moz-appearance:textfield; appearance:textfield; }
.amount-picker input.amount-input[type="number"]::-webkit-outer-spin-button,.amount-picker input.amount-input[type="number"]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
.amount-picker input.amount-input[type="number"]:focus { outline:none; border-color:var(--accent-color); }
.srange { display:flex; justify-content:space-between; max-width:360px; padding-right:156px; font-size:.75em; color:var(--summary-color); }
.row > .s-daysbox { flex:1 1 300px; }
.bits { display:flex; gap:6px; margin:8px 0 4px; }
.bits span { flex:1; display:flex; gap:2px; }
.bits i { flex:1; height:10px; border-radius:2px; background:var(--accent-color); }
.bits i.h { background:var(--button-bg); }
.err-t { color:var(--error-color); font-weight:bold; }
.mlegend { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:.82em; color:var(--summary-color); align-items:center; margin-bottom:6px; }
.logrow.sel { background:var(--entry-bg); padding-left:8px; padding-right:8px; }
/* Modal */
.overlay { position:fixed; inset:0; background:var(--overlay-color); z-index:1000; display:flex; align-items:flex-start; justify-content:center; padding:20px 12px; overflow-y:auto; }
.modal { background:var(--container-bg); border:1px solid var(--border-color); border-radius:8px; width:100%; max-width:640px; padding:20px; box-shadow:0 4px 20px var(--shadow-color); }
.modal h2 { margin:0 0 14px; color:var(--accent-color); font-size:1.3em; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); padding-bottom:10px; }
.modal h3 { color:var(--accent-color); margin:18px 0 10px; font-size:1.15em; border-bottom:1px solid var(--border-color); padding-bottom:4px; }
.modal p,.modal li { font-size:.9em; line-height:1.5; }
.modal ul { padding-left:20px; margin:6px 0; }
.modal code { background:var(--entry-bg); border:1px solid var(--border-color); border-radius:3px; padding:1px 5px; font-size:.9em; }
.x { background:none; border:none; color:var(--fg-color); font-size:1.4em; cursor:pointer; line-height:1; padding:0 4px; }
.row { display:flex; flex-wrap:wrap; gap:10px; } .row>div { flex:1 1 200px; margin-bottom:10px; }
.field { margin-bottom:10px; }
.hint { font-size:.78em; color:var(--summary-color); margin-top:3px; }
.modal-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.modal-actions .spacer { margin-left:auto; }
.danger-zone { border-top:2px solid var(--error-color); margin-top:20px; padding-top:12px; }
.danger-title { color:var(--error-color); margin:14px 0 8px; font-size:1.05em; }
.callout { border-left:4px solid var(--border-color); background:var(--entry-bg); border-radius:4px; padding:10px 14px; margin:12px 0; font-size:.9em; line-height:1.5; }
.callout.err { border-left-color:var(--error-color); } .callout.warn { border-left-color:var(--warning-color); }
.callout .modal-actions { margin-top:10px; }
.lab { font-size:.85em; color:var(--summary-color); margin:0 0 2px; }
.modal:focus { outline:none; }

/* Floating message banner */
.message-area { position:absolute; top:0; left:0; right:0; min-height:80px; z-index:1100; border-radius:8px; padding:10px 15px; font-family:'Consolas','Monaco',monospace; font-size:.9em; font-weight:bold; line-height:1.6; text-align:left; white-space:pre-wrap; word-wrap:break-word; border:1px solid transparent; opacity:1; visibility:visible; transition:opacity .3s,visibility .3s; }
.message-area.hidden { opacity:0; visibility:hidden; pointer-events:none; }
.message-area.pinned { position:fixed; top:8px; }  /* container scrolled off screen: keep the banner visible */
.message-area.error { background:color-mix(in srgb,var(--error-color) 10%,white); color:var(--error-color); border-color:var(--error-color); }
.message-area.warning { background:color-mix(in srgb,var(--warning-color) 10%,white); color:var(--warning-color); border-color:var(--warning-color); }
.message-area.info { background:color-mix(in srgb,var(--info-color) 10%,white); color:var(--info-color); border-color:var(--info-color); }
.message-area.success { background:color-mix(in srgb,var(--success-color) 10%,white); color:var(--success-color); border-color:var(--success-color); }
body.dark-mode .message-area.error { background:color-mix(in srgb,var(--error-color) 20%,black); }
body.dark-mode .message-area.warning { background:color-mix(in srgb,var(--warning-color) 20%,black); }
body.dark-mode .message-area.info { background:color-mix(in srgb,var(--info-color) 20%,black); }
body.dark-mode .message-area.success { background:color-mix(in srgb,var(--success-color) 20%,black); }

.data-config { text-align:center; margin-top:20px; }
.data-config button { background:none; border:none; color:var(--fg-color); font-size:.85em; opacity:.7; cursor:pointer; font-family:inherit; }
.data-config button:hover { opacity:1; text-decoration:underline; }
footer { text-align:center; margin-top:10px; padding-top:5px; }
footer a { color:var(--accent-color); text-decoration:none; font-weight:bold; }
footer a:hover { text-decoration:underline; }
footer .footer-portfolio { margin-top:8px; font-size:.85em; opacity:.7; }
.hide { display:none !important; }
@media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
@media (max-width:600px) { input,select,textarea { font-size:16px; } }  /* stops iOS from zooming in on focus */
@media (pointer:coarse) { .btn.sm { padding:8px 12px; } .chip { padding:6px 11px; } .x,.dh { padding:6px 10px; } }
</style>
</head>
<body class="dark-mode">
<div class="container">
  <div id="message-area" class="message-area hidden" role="status" aria-live="polite"></div>
  <h1>Web Network Manager</h1>
  <h2 class="subtitle">by Mattias</h2>

  <div class="controls">
    <button class="btn accent" id="addBtn">+ Add Host</button>
    <input class="grow" id="search" type="search" placeholder="Search name, IP, role, notes..." autocomplete="off" aria-label="Search hosts">
    <select id="roleFilter" aria-label="Filter by role"></select>
    <select id="netSel" class="hide" aria-label="Network"></select>
    <button class="btn" id="netBtn">Networks</button>
    <button class="btn" id="mapBtn">Map</button>
    <button class="btn" id="themeBtn" aria-label="Toggle theme">◐</button>
    <button class="btn" id="infoBtn">Info</button>
  </div>
  <div class="chips hide" id="tagBar" style="margin:0 0 10px"></div>
  <p class="count" id="count"></p>
  <div id="hosts"></div>
  <div class="data-config"><button id="resetOrder">Reset order</button></div>
</div>

<div class="data-config"><button id="dataBtn">Data Config</button></div>
<footer>
  <a href="https://github.com/mattiasmilger/Web-Network-Manager-by-Mattias" target="_blank" rel="noopener noreferrer">GitHub Repository</a>
  <div class="footer-portfolio">More projects? <a href="https://mattiasmilger.github.io/" target="_blank" rel="noopener noreferrer">Visit my portfolio</a></div>
</footer>

<div class="overlay hide" id="overlay"><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"></div></div>
<input type="file" id="importFile" accept="application/json,.json" class="hide">
<script>
/* ===== Constants and state ===== */
/* Saved-data format: every save writes SCHEMA. To change the format, bump SCHEMA and add
   MIGRATIONS[<previous version>] (see "Data model"). A build never overwrites newer data. */
const STORE = { hosts: 'netmanager.hosts', layout: 'netmanager.layout', links: 'netmanager.links', networks: 'netmanager.networks', schema: 'netmanager.schema', backup: 'netmanager.backup', theme: 'netmanager.theme' };
const SCHEMA = 4;
const MESSAGE_DURATION_SHORT = 2000, MESSAGE_DURATION_LONG = 3500;
const SCHEMES = ['http', 'https', 'ssh', 'rdp', 'vnc', 'smb', 'ftp', 'url'];
const DEF = { http: 80, https: 443, ssh: 22, rdp: 3389, vnc: 5900, smb: 445, ftp: 21 };
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/, URL_RE = /^(https?|ssh|rdp|vnc|smb|ftp):\/\//i;
const $ = s => document.querySelector(s);
let hosts = [], layout = { net: '' }, links = [], networks = [], mapNet = '', activeTag = '', view = { net: '', multi: false };
let modalSave = null, dirty = false, downOnBackdrop = false, deleteArmed = false, editingId = null, mapDraft = { from: '', label: '', editId: '', net: '' };
let storageLocked = false, pendingBackup = null, unreadableData = false, lastFocus = null, searchTimer = 0;

/* ===== Utilities ===== */
function showMessage(message, type = 'error') {
  const area = $('#message-area');
  area.textContent = message;
  area.className = `message-area ${type}`;
  const box = area.parentElement.getBoundingClientRect(), pin = box.top < 0;  /* keep the banner visible when the page is scrolled down */
  area.classList.toggle('pinned', pin);

function saveHost(id) {
  const all = s => [...document.querySelectorAll('#modal ' + s)], q = (r, c) => r.querySelector(c).value.trim(), v = k => $('#f-' + k).value.trim();

    if (!a.ip && !a.dns) continue;

    if (a.dns && !isDns(a.dns)) return showMessage(`“${a.dns}” is not a valid DNS name.`);

  }
  if (!addrs.length) return showMessage('Add at least one IP address or DNS name.');

  for (const r of all('.erow')) {

    if (!e.label && !e.path && (!e.port || (e.scheme !== 'url' && +e.port === DEF[e.scheme]))) continue;
    if (e.scheme === 'url' && !URL_RE.test(e.port)) return showMessage(`“${e.port}” is not a valid URL.`);
    if (e.scheme !== 'url' && e.port && !(/^\d{1,5}$/.test(e.port) && +e.port >= 1 && +e.port <= 65535)) return showMessage(`“${e.port}” is not a valid port (1-65535).`);
    if (e.scheme === 'ssh' && e.path && !/^[\w.-]+$/.test(e.path)) return showMessage('SSH username may only contain letters, digits, dot, dash and underscore.');
    endpoints.push(e);
  }
  const old = hosts.find(x => x.id === id);
  const schedules = all('.srow').map(r => ({ name: q(r, '.s-name'), mode: q(r, '.s-mode'), repeat: q(r, '.s-repeat'), days: q(r, '.s-days'), monthDays: q(r, '.s-month'), start: q(r, '.s-start'), last: r.querySelector('.s-last') ? q(r, '.s-last') : '', note: q(r, '.s-note') })).filter(x => x.name || x.days || x.monthDays || x.start || x.note);
  const badSc = schedules.find(x => x.repeat === 'month' && !parseMonthDays(x.monthDays).length);
  if (badSc) return showMessage(`“${badSc.name || 'Schedule'}”: enter at least one day of the month (1-31).`);
  const docs = () => all('.drow').map(r => ({ title: q(r, '.d-title'), text: r.querySelector('.d-text').value.trimEnd() }));
  const rec = sanitize({ id: id || uid(), name, emoji: v('emoji'), role: v('role'), os: v('os'), lang: v('lang'), hardware: v('hardware'), group: old ? old.group : '',
    tags: v('tags').split(','), addrs, endpoints, notes: docs(),
    schedules, log: old ? old.log : [] });
  const dupe = hosts.find(o => o.id !== rec.id && o.addrs.some(a => rec.addrs.some(b => a.net === b.net && ((a.ip && a.ip === b.ip) || (a.dns && b.dns && a.dns.toLowerCase() === b.dns.toLowerCase())))));

  for (const k of [...openNotes]) if (k.startsWith(rec.id + ':')) openNotes.delete(k);

  if (!saveHosts()) return;
  closeModal(); render();
  const out = rec.addrs.find(a => { const d = netDef(a.net); return a.ip && d && d.cidr && ip4(a.ip) !== null && !inNet(parseCidr(d.cidr), a.ip); });
  if (dupe) showMessage(`Saved, but an address is also used by “${dupe.name}” on the same network.`, 'warning');
  else if (out) showMessage(`Saved, but ${out.ip} is outside ${out.net} (${netDef(out.net).cidr}).`, 'warning');

}

$('#overlay').onpointerdown = e => { downOnBackdrop = e.target.id === 'overlay'; };
$('#overlay').oninput = e => {

document.addEventListener('keydown', e => {

/* ===== Drag and drop ===== */
let drag = null;

$('#hosts').addEventListener('pointerdown', e => {

/* Reorder notes & commands inside the host form: drag the handle, or focus it and use the arrow keys */
let ndrag = null;
$('#overlay').addEventListener('pointerdown', e => {
